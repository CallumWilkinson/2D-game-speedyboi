name: Unity Tests

on:
  # Manual runs from the Actions tab with inputs
  workflow_dispatch:
    inputs:
      mode:
        description: "Which tests to run"
        type: choice
        options: [both, editmode, playmode]
        default: both
        required: true
      coverage:
        description: "Generate coverage for EditMode?"
        type: boolean
        default: false
        required: true

concurrency:
  group: unity-tests-${{ github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT_PATH: .
  UNITY_VERSION: 2022.3.21f1
  MIN_COVERAGE: "0" # optional, used only if you later add a coverage gate

jobs:
  tests:
    name: EditMode + PlayMode (manual)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: ${{ inputs.mode != 'editmode' }}

      - name: Ensure/Fetch LFS
        if: inputs.mode != 'editmode'
        run: |
          git lfs install --local
          git lfs pull && git lfs checkout
          if git lfs ls-files | awk '$2=="-"{exit 1}'; then echo "LFS OK"; else exit 1; fi

      - name: Validate LFS pointers resolved
        if: inputs.mode != 'editmode'
        run: |
          missing=$(git lfs ls-files | awk '$2=="-" {print}')
          if [ -n "$missing" ]; then echo "Unfetched LFS files:"; echo "$missing"; exit 1; fi

      # ---------- CACHES ----------
      - name: Cache UPM (packages)
        id: upm
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/unity3d
            ~/.local/share/unity3d
          key: upm-${{ runner.os }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt','**/Packages/manifest.json','**/Packages/packages-lock.json') }}
          restore-keys: upm-${{ runner.os }}-

      # Restore Library cache
      - name: Restore Unity Library cache
        id: lib-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: lib-${{ runner.os }}-tests-${{ hashFiles('ProjectSettings/ProjectVersion.txt','Packages/manifest.json','Packages/packages-lock.json') }}
          restore-keys: |
            lib-${{ runner.os }}-tests-
            lib-${{ runner.os }}-

      - name: Cache status
        run: |
          echo "UPM cache hit: ${{ steps.upm.outputs['cache-hit'] }}"
          echo "Library cache hit: ${{ steps.lib-cache.outputs['cache-hit'] }}"

      - name: Guard – UNITY_LICENSE present
        run: |
          if [ -z "${UNITY_LICENSE}" ]; then
            echo "UNITY_LICENSE secret is missing"; exit 1; fi

      # ---------- EDITMODE ----------
      # Coverage ON only if requested in manual inputs
      - name: Run EditMode tests (with coverage)
        if: github.event_name == 'workflow_dispatch' && inputs.coverage == true && (inputs.mode == 'both' || inputs.mode == 'editmode')
        uses: game-ci/unity-test-runner@v4
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: EditMode
          artifactsPath: artifacts-edit
          coverageOptions: generateAdditionalMetrics;generateHtmlReport;assemblyFilters:+*
          customParameters: -logFile - -nographics -enableUPMTrace

      # Faster path (no coverage) when coverage=false
      - name: Run EditMode tests (no coverage)
        if: github.event_name == 'workflow_dispatch' && inputs.coverage == false && (inputs.mode == 'both' || inputs.mode == 'editmode')
        uses: game-ci/unity-test-runner@v4
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: EditMode
          artifactsPath: artifacts-edit
          customParameters: -logFile - -nographics -enableUPMTrace

      - name: Upload artifacts (EditMode)
        if: always() && github.event_name == 'workflow_dispatch' && (inputs.mode == 'both' || inputs.mode == 'editmode')
        uses: actions/upload-artifact@v4
        with:
          name: editmode-artifacts
          path: |
            artifacts-edit/**
            ${{ env.PROJECT_PATH }}/**/Editor.log
          if-no-files-found: ignore
          retention-days: 14

      # ---------- PLAYMODE ----------
      - name: Run PlayMode tests (headless)
        if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'both' || inputs.mode == 'playmode')
        uses: game-ci/unity-test-runner@v4
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: PlayMode
          artifactsPath: artifacts-play
          customParameters: -logFile - -nographics

      - name: Upload artifacts (PlayMode)
        if: always() && github.event_name == 'workflow_dispatch' && (inputs.mode == 'both' || inputs.mode == 'playmode')
        uses: actions/upload-artifact@v4
        with:
          name: playmode-artifacts
          path: |
            artifacts-play/**
            ${{ env.PROJECT_PATH }}/**/Editor.log
          if-no-files-found: ignore
          retention-days: 14

      # Save Library cache only if no exact hit
      - name: Save Unity Library cache (on miss)
        if: always() && steps.lib-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: lib-${{ runner.os }}-tests-${{ hashFiles('ProjectSettings/ProjectVersion.txt','Packages/manifest.json','Packages/packages-lock.json') }}
