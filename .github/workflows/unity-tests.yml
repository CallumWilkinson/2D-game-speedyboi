name: Unity Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: unity-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT_PATH: .
  UNITY_VERSION: 2022.3.21f1
  MIN_COVERAGE: "0" # set to "40" for 40% gate later if desired

jobs:
  tests:
    name: EditMode + PlayMode
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1 # was 0; faster unless you truly need history

      - name: Ensure/Fetch LFS
        run: |
          git lfs install --local
          git lfs pull
          git lfs checkout

      - name: Validate LFS pointers resolved
        run: |
          missing=$(git lfs ls-files | awk '$2=="-" {print}')
          if [ -n "$missing" ]; then
            echo "Unfetched LFS files:"; echo "$missing"; exit 1
          fi

      # ---------- CACHES ----------
      - name: Cache UPM (packages)
        id: upm
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/unity3d
            ~/.local/share/unity3d
          key: upm-${{ runner.os }}-${{ env.UNITY_VERSION }}-${{ hashFiles('**/Packages/manifest.json', '**/Packages/packages-lock.json') }}
          restore-keys: |
            upm-${{ runner.os }}-${{ env.UNITY_VERSION }}-

      - name: Cache Unity Library
        id: lib
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: lib-${{ runner.os }}-${{ env.UNITY_VERSION }}-${{ hashFiles('**/Packages/manifest.json', '**/Packages/packages-lock.json') }}
          restore-keys: |
            lib-${{ runner.os }}-${{ env.UNITY_VERSION }}-

      - name: Cache status
        run: |
          echo "UPM cache hit: ${{ steps.upm.outputs.cache-hit }}"
          echo "Library cache hit: ${{ steps.lib.outputs.cache-hit }}"

      - name: Guard – UNITY_LICENSE present
        run: |
          if [ -z "${UNITY_LICENSE}" ]; then
            echo "UNITY_LICENSE secret is missing"; exit 1; fi

      # ---------- EDITMODE ----------
      # Coverage on main pushes (kept), faster no-coverage on PRs
      - name: Run EditMode tests
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: game-ci/unity-test-runner@v4
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: EditMode
          artifactsPath: artifacts-edit
          coverageOptions: generateAdditionalMetrics;generateHtmlReport;assemblyFilters:+*
          customParameters: -logFile - -nographics -enableUPMTrace

      - name: Run EditMode tests (no coverage)
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        uses: game-ci/unity-test-runner@v4
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: EditMode
          artifactsPath: artifacts-edit
          customParameters: -logFile - -nographics -enableUPMTrace

      # ---------- PLAYMODE ----------
      # Keep PlayMode lean (no coverage here to save time)
      - name: Run PlayMode tests (headless)
        uses: game-ci/unity-test-runner@v4
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: PlayMode
          artifactsPath: artifacts-play
          customParameters: -logFile - -nographics

      # ---------- ARTIFACTS ----------
      # Single upload step (smaller overhead than two separate uploads)
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            artifacts-edit/**
            artifacts-play/**
            ${{ env.PROJECT_PATH }}/**/Editor.log
          if-no-files-found: ignore
          retention-days: 14
