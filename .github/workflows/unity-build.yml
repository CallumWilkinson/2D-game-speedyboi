name: Unity Build

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Build target"
        type: choice
        options: [StandaloneWindows64, Linux64, WebGL]
        default: StandaloneWindows64
        required: true
      winIL2CPP:
        description: "Windows build uses IL2CPP (requires Windows runner)"
        type: boolean
        default: false
        required: true
      retentionDays:
        description: "Artifact retention days"
        type: number
        default: 1
        required: true

concurrency:
  group: unity-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT_PATH: .
  UNITY_VERSION: auto

jobs:
  # ---------- Linux path (WebGL, Linux, Win-Mono)
  build-linux:
    name: Build (${{ inputs.target }}) on Linux
    runs-on: ubuntu-latest
    if: ${{ !(inputs.target == 'StandaloneWindows64' && inputs.winIL2CPP == true) }}
    timeout-minutes: 60
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}

    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Ensure/Fetch LFS
        run: |
          git lfs install --local
          git lfs pull
          git lfs checkout
          if git lfs ls-files | awk '$2=="-"{exit 1}'; then echo "LFS OK"; else exit 1; fi

      - name: Cache UPM (packages)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/unity3d
            ~/.local/share/unity3d
          key: upm-${{ runner.os }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt','Packages/manifest.json','Packages/packages-lock.json') }}
          restore-keys: upm-${{ runner.os }}-

      - name: Cache Unity Library (per target + version)
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: lib-${{ runner.os }}-${{ inputs.target }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt','Packages/manifest.json','Packages/packages-lock.json') }}
          restore-keys: |
            lib-${{ runner.os }}-${{ inputs.target }}-
            lib-${{ runner.os }}-

      - name: Guard – License present (Personal or Pro)
        run: |
          if [ -z "${UNITY_LICENSE}${UNITY_SERIAL}" ]; then
            echo "Provide UNITY_LICENSE (Personal) or UNITY_SERIAL (Pro) in repo secrets."; exit 1; fi

      - name: Build (GameCI Unity Builder)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ env.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ env.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ env.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ env.UNITY_SERIAL }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: auto
          targetPlatform: ${{ inputs.target }}
          versioning: None

      - name: Upload build artifact (no zip)
        uses: actions/upload-artifact@v4
        with:
          name: Build-${{ inputs.target }}
          path: build
          retention-days: ${{ inputs.retentionDays }}
          compression-level: 1

  # ---------- Windows path (Win-IL2CPP only)
  build-windows-il2cpp:
    name: Build (StandaloneWindows64 IL2CPP) on Windows
    runs-on: windows-latest
    if: ${{ inputs.target == 'StandaloneWindows64' && inputs.winIL2CPP == true }}
    timeout-minutes: 90
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}

    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Ensure/Fetch LFS
        shell: bash
        run: |
          git lfs install --local
          git lfs pull
          git lfs checkout
          if git lfs ls-files | awk '$2=="-"{exit 1}'; then echo "LFS OK"; else
            echo "Missing LFS files"; exit 1; fi

      - name: Cache UPM (packages) [Windows]
        uses: actions/cache@v4
        with:
          path: |
            C:\Users\runneradmin\AppData\Local\Unity\cache
            C:\Users\runneradmin\AppData\Roaming\Unity\Packages
          key: upm-${{ runner.os }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt','Packages/manifest.json','Packages/packages-lock.json') }}
          restore-keys: upm-${{ runner.os }}-

      - name: Cache Unity Library (per target + version)
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: lib-${{ runner.os }}-StandaloneWindows64-${{ hashFiles('ProjectSettings/ProjectVersion.txt','Packages/manifest.json','Packages/packages-lock.json') }}
          restore-keys: |
            lib-${{ runner.os }}-StandaloneWindows64-
            lib-${{ runner.os }}-

      - name: Guard – License present (Personal or Pro)
        shell: bash
        run: |
          if [ -z "${UNITY_LICENSE}${UNITY_SERIAL}" ]; then
            echo "Provide UNITY_LICENSE (Personal) or UNITY_SERIAL (Pro) in repo secrets."; exit 1; fi

      - name: Build (GameCI Unity Builder)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ env.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ env.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ env.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ env.UNITY_SERIAL }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: auto
          targetPlatform: StandaloneWindows64
          versioning: None

      - name: Upload build artifact (no zip)
        uses: actions/upload-artifact@v4
        with:
          name: Build-StandaloneWindows64
          path: build
          retention-days: ${{ inputs.retentionDays }}
          compression-level: 1
